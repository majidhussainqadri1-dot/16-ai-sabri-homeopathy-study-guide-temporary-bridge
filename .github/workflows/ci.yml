name: File 16 Forty-Round CI

on:
  push:
    branches: [main, 'audit/**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source and contracts
        run: bash scripts/verify.sh
      - name: Build twice and compare
        run: |
          SOURCE_DATE_EPOCH=1786075200 bash scripts/build.sh
          cp dist/16-sabri-classical-homeopathy-ai-2.2.1.zip /tmp/first.zip
          SOURCE_DATE_EPOCH=1786075200 bash scripts/build.sh
          cmp /tmp/first.zip dist/16-sabri-classical-homeopathy-ai-2.2.1.zip
      - name: Clean extract retest
        run: |
          mkdir /tmp/scha-clean
          unzip -q dist/16-sabri-classical-homeopathy-ai-2.2.1.zip -d /tmp/scha-clean
          find /tmp/scha-clean -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          node --check /tmp/scha-clean/16-sabri-classical-homeopathy-ai/assets/js/public.js
          node --check /tmp/scha-clean/16-sabri-classical-homeopathy-ai/assets/js/admin.js
          test -f /tmp/scha-clean/16-sabri-classical-homeopathy-ai/docs/FORTY-ROUND-AUDIT-2026-08-07.md
      - name: Archive integrity
        run: unzip -t dist/16-sabri-classical-homeopathy-ai-2.2.1.zip
      - name: Upload package evidence
        uses: actions/upload-artifact@v4
        with:
          name: file-16-2.2.1-package
          path: |
            dist/16-sabri-classical-homeopathy-ai-2.2.1.zip
            dist/16-sabri-classical-homeopathy-ai-2.2.1.zip.sha256
            dist/manifest.json
